<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Love ❤️</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #2b0a12 0%, #000 80%);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
    color: #fefefe;
  }

  .card {
    position: relative;
    width: 320px;
    height: 420px;
    perspective: 1200px;
  }

  .inner {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #111;
    border: 2px solid #c0a060;
    border-radius: 16px;
    box-shadow: 0 0 30px rgba(192,160,96,0.4);
    transition: transform 1.5s ease;
    transform-style: preserve-3d;
  }

  .card.flipped .inner {
    transform: rotateY(180deg);
  }

  .front, .back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 16px;
    overflow: hidden;
  }

  .front {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: linear-gradient(145deg, #1b1b1b, #2a0d12);
  }

  .back {
    background: linear-gradient(145deg, #1b1b1b, #2a0d12);
    transform: rotateY(180deg);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    text-align: center;
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 16px;
    z-index: 0;
  }

  h1 {
    font-size: 1.6em;
    color: #f5d96b;
    text-shadow: 0 0 10px #d4b24a;
    opacity: 0;
    animation: fadeInText 3s ease forwards;
    animation-delay: 4.5s;
    z-index: 1;
  }

  h2 {
    font-size: 1em;
    color: #eee;
    opacity: 0;
    animation: fadeInText 3s ease forwards;
    animation-delay: 5.5s;
    z-index: 1;
  }

  @keyframes fadeInText {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .back h3 {
    font-size: 1.3em;
    color: #f5d96b;
    line-height: 1.6em;
  }

  .heart {
    position: absolute;
    color: #ff3366;
    animation: float 5s linear infinite;
    pointer-events: none;
  }

  @keyframes float {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="inner">
    <div class="front">
      <canvas id="heartCanvas"></canvas>
      <h1>Happy Birthday My Love ❤️</h1>
      <h2>— Adrien 💫</h2>
    </div>
    <div class="back">
      <h3>Your DMs hold a poem for you,<br>my love 💌</h3>
    </div>
  </div>
</div>

<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_03d0f9872e.mp3?filename=romantic-piano-ambient-110139.mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById('heartCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 320;
canvas.height = 420;

const dots = [];
const heartPoints = [];
const totalDots = 300;
let reveal = false;

function heartFunction(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return { x, y };
}

for (let i = 0; i < totalDots; i++) {
  const t = Math.PI - (i / totalDots) * 2 * Math.PI;
  const p = heartFunction(t);
  heartPoints.push({
    x: p.x * 8 + canvas.width / 2,
    y: -p.y * 8 + canvas.height / 2
  });
}

for (let i = 0; i < totalDots; i++) {
  dots.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    targetX: heartPoints[i].x,
    targetY: heartPoints[i].y,
    size: Math.random() * 1.5 + 0.5,
    color: 'rgba(245,217,107,0.8)'
  });
}

let frame = 0;
function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  frame++;

  dots.forEach(dot => {
    dot.x += (dot.targetX - dot.x) * 0.03;
    dot.y += (dot.targetY - dot.y) * 0.03;
    ctx.beginPath();
    ctx.arc(dot.x, dot.y, dot.size, 0, Math.PI * 2);
    ctx.fillStyle = dot.color;
    ctx.fill();
  });

  if (frame > 200 && !reveal) {
    reveal = true;
    startEffects();
  }

  requestAnimationFrame(animate);
}
animate();

function startEffects() {
  playMusic();
  setInterval(createFloatingHeart, 400);
  setTimeout(() => {
    document.getElementById('card').classList.add('flipped');
  }, 9000);
}

function createFloatingHeart() {
  const heart = document.createElement('div');
  heart.classList.add('heart');
  heart.textContent = '❤';
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.fontSize = Math.random() * 20 + 15 + 'px';
  heart.style.animationDuration = Math.random() * 3 + 3 + 's';
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 5000);
}

function playMusic() {
  const music = document.getElementById('bgMusic');
  music.play().catch(() => {
    // fallback tap-to-play for mobile
    document.body.addEventListener('click', () => music.play(), { once: true });
  });
}
</script>

</body>
</html>
